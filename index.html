<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2BA84A">
<link rel="manifest" href="manifest.webmanifest">
<title>Three Signs</title>
<link rel="stylesheet" href="src/ui/loading.css">
<link rel="stylesheet" href="src/ui/fonts.css">
<link rel="stylesheet" href="src/ui/organic.css">
<link rel="stylesheet" href="src/ui/lobby.css">
<link rel="stylesheet" href="src/ui/shop.css">
<link rel="stylesheet" href="src/ui/ads.css">
<link rel="stylesheet" href="src/ui/style.css">
<link rel="stylesheet" href="src/ui/story.css">
<link rel="stylesheet" href="src/ui/voyage.css">
<link rel="stylesheet" href="src/ui/tutorial.css">
<link rel="stylesheet" href="src/ui/duel.css">
<link rel="stylesheet" href="src/ui/ranking.css">
<link rel="stylesheet" href="src/ui/daily.css">
<link rel="stylesheet" href="src/ui/touch.css">
</head>
<body>
<div id="loading" class="ld" role="progressbar" aria-busy="true" aria-valuemin="0" aria-valuemax="100" data-i18n-aria="loading.aria">
  <!-- Même logo que assets/icone-app/icone.svg (calque « logo »), à la taille de l'écran de démarrage natif. -->
  <svg class="ld-logo" viewBox="0 0 1024 1024" aria-hidden="true"><g stroke="#15301E" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="512" cy="512" r="232" fill="none" stroke="#15301E" stroke-width="92"/>
    <circle cx="512" cy="512" r="232" fill="none" stroke="#FFD23F" stroke-width="56"/>
    <polygon points="512,350 662,606 362,606" fill="#15301E" stroke-width="36" transform="translate(0 16)"/>
    <polygon points="512,350 662,606 362,606" fill="#FF8C32" stroke-width="36"/>
    <polygon points="512,368 512,594 380,594" fill="#FFA95E" stroke="none"/>
    <circle cx="694" cy="330" r="46" fill="#FFF6E5" stroke-width="22"/>
  </g></svg>
  <div class="ld-foot">
    <div class="ld-title">Three Signs</div>
    <div class="ld-bar"><i id="ldBar"></i><b></b></div>
    <p class="ld-tip" id="ldTip"></p>
  </div>
</div>
<div id="safe"></div>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-av" id="hudAv"></div>
    <div class="hud-life">
      <div class="hud-life-top"><span class="hud-name" id="hudName"></span><span class="hud-hp" id="hudHp"></span></div>
      <div class="hud-bar"><i id="hudBar"></i></div>
      <div class="hud-gauge" id="hudGaugeBox" data-i18n-title="hud.gaugeTitle"><i id="hudGauge"></i></div>
    </div>
    <button id="quit" class="hud-quit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E6FAD8" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span id="quitTxt" data-i18n="hud.quit"></span></button>
  </div>
  <div class="hud-card" id="hudCard">
    <div class="hud-wave">
      <div class="hud-kv"><span class="hud-k" id="hudWaveK" data-i18n="hud.wave"></span><span class="hud-v" id="hudWave"></span></div>
      <div class="hud-pips" id="hudPips"></div>
    </div>
    <div class="hud-timer" id="hudTimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg><span id="hudTime"></span></div>
    <div class="hud-score"><span class="hud-k" data-i18n="hud.score"></span><span class="hud-v" id="hudScore"></span></div>
  </div>
  <div class="hud-arena" id="hudArena"></div>
  <div id="trainPanel" class="hud-train"></div>
  <div class="hud-streak" id="hudStreak"></div>
  <div class="hud-boosts" id="hudBoosts"></div>
  <button id="superBtn" class="hud-super hidden" data-i18n-aria="hud.superAria"><b id="superVal" data-i18n="hud.super"></b><small id="superName"></small></button>
</div>

<div id="lobby" class="lobby"></div>

<p id="loadErr" class="hidden"></p>

<script type="module" src="src/main.js"></script>
<script>
// Ouvert directement comme fichier, le navigateur bloque les modules : on le dit au joueur.
// Seulement en file:// : sur un téléphone lent, le jeu peut mettre plus de 2,5 s à démarrer sans que rien ne soit cassé.
if(location.protocol==='file:')setTimeout(function(){if(window.__tsReady)return;var e=document.getElementById('loadErr');if(e.textContent)return;
  var l=document.getElementById('loading');if(l)l.remove();
  e.textContent='Le jeu ne peut pas démarrer depuis un fichier local. Lancez-le via un serveur (voir LISEZMOI.md).';e.classList.remove('hidden')},2500);
</script>
</body>
</html>
